<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Q&A</title>
    <link rel="stylesheet" href="./local-qa.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel">
        <h1>Document invoer</h1>
        <p>Documenten worden in deze browser bewaard, ook na herladen. Verwijder ze via de documentenlijst. Er wordt niets verstuurd.</p>
        <p class="error" data-storage-error role="alert"></p>

        <form id="document-form" novalidate>
          <label>
            Titel
            <input id="title" name="title" type="text" placeholder="Documenttitel" required />
          </label>

          <label>
            Inhoud
            <textarea id="content" name="content" rows="6" placeholder="Plak hier het document of een citaat..." required></textarea>
          </label>

          <label>
            Herkomst
            <input id="origin" name="origin" type="text" placeholder="Bijv. Intern rapport, externe bron, ..." />
          </label>

          <label>
            Status
            <select id="status" name="status">
              <option value="draft">draft</option>
              <option value="historisch">historisch</option>
              <option value="specificatie">specificatie</option>
            </select>
          </label>

          <div class="actions">
            <button type="submit">Document opslaan</button>
            <button type="button" id="reset-document" class="secondary">Nieuw / Reset</button>
          </div>
        </form>

        <p class="error" data-error-box aria-live="polite"></p>
        <p data-save-status role="status"></p>
      </section>

      <section class="panel">
        <h2>Mijn documenten</h2>
        <p data-library-empty>Nog geen opgeslagen documenten.</p>
        <ul data-document-list class="document-list" aria-label="Opgeslagen documenten"></ul>
        <button type="button" id="delete-document" class="secondary" disabled>Geselecteerd document verwijderen</button>
        <h2>Citaat</h2>
        <ul data-quote-list class="quote-list"></ul>
      </section>
    </main>

    <script type="module" src="./local-qa-ui.mjs"></script>
  </body>
</html>
